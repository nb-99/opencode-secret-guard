name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # The unit tests cover both modes on each system with a fake backend.
        # The kernel suite runs only where a shell sandbox backend exists.
        include:
          - os: macos-15
            kernel: true
          - os: ubuntu-latest
            kernel: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      # Pinned by commit rather than tag: a mutable tag is a supply-chain hole,
      # and this repository's whole job is not leaving those open.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Flake checks
        run: nix flake check -L

      # Cannot be a check: no sandbox can be applied inside the Nix build sandbox.
      - name: Kernel integration tests
        if: matrix.kernel
        run: nix run .#integration
