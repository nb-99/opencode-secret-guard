name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # sandbox-exec is macOS-only, and the kernel suite is the point.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Flake checks
        run: nix flake check -L

      # Cannot be a check: the Nix build sandbox has no /usr/bin/sandbox-exec.
      - name: Kernel integration tests
        run: nix run .#integration
