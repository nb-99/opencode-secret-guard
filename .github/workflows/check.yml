name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # The unit tests cover both modes on each system with a fake backend.
        # The kernel suite runs only where a shell sandbox backend exists.
        include:
          - os: macos-15
            kernel: true
          - os: ubuntu-latest
            kernel: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      # Pinned by commit rather than tag: a mutable tag is a supply-chain hole,
      # and this repository's whole job is not leaving those open.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Flake checks
        run: nix flake check -L

      # Cannot be a check: no sandbox can be applied inside the Nix build sandbox.
      - name: Kernel integration tests
        if: matrix.kernel
        run: nix run .#integration

  release:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags so semantic-release finds the previous release
          # and every commit since it; let semantic-release authenticate pushes
          # via GITHUB_TOKEN rather than leaving credentials in .git/config.
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Pinned by flake.lock rather than pulling semantic-release from npm at runtime.
      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run --inputs-from . nixpkgs#semantic-release
