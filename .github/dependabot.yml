version: 2

updates:
  # Workflow actions are pinned by commit, so Dependabot rewrites the SHA and
  # keeps the trailing version comment in step.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  # Both npm dependencies reach the build through the lockfile: the version
  # comes from package.json, the fetch hash from the integrity in
  # package-lock.json, and nix/checks.nix and nix/zod.nix assert the two files
  # agree. A bump therefore needs no Nix edit, and a package.json edited
  # without the lock fails the build instead of fetching something unproven.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      # nixpkgs decides the compiler version, and a check asserts package.json
      # agrees with it. Proposing whatever npm has newest only produces PRs
      # that cannot pass until nixpkgs catches up.
      - dependency-name: typescript

# Not covered: the nixpkgs flake input, which pins bun, tsc and the build
# itself. Dependabot has no Nix ecosystem; `nix flake update` handles it.
